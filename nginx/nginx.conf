user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# The L402 module is a dynamic module and must be loaded before any l402_*
# directive is parsed.
load_module /etc/nginx/modules/libngx_l402_lib.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Docker's embedded DNS. Resolving backends at request time rather than at
    # startup means nginx still boots if sqzd is temporarily down.
    resolver 127.0.0.11 ipv6=off valid=30s;

    upstream sqzd {
        server sqzd:8080;
        keepalive 32;
    }

    server {
        listen 8000;
        listen [::]:8000;
        server_name _;

        # Redirects carry no request body; link events are small.
        client_max_body_size 64k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- public routes -------------------------------------------------
        # These must never return 402.

        location = /health {
            proxy_pass http://sqzd;
        }

        # robots.txt / sitemap at the edge. Redirect routes set their own
        # X-Robots-Tag: noindex, so they're left crawlable rather than Disallowed.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /api/\nAllow: /\nSitemap: https://sqzit.in/sitemap.xml\n";
        }

        location = /sitemap.xml {
            default_type application/xml;
            return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url><loc>https://sqzit.in/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>\n</urlset>\n";
        }

        # NIP-05 is fetched by other nostr clients to verify a name. They have
        # no way to pay an invoice, so paywalling this would break every
        # @name link at the point of verification.
        location /.well-known/ {
            proxy_pass http://sqzd;
        }

        # ---- paid routes ---------------------------------------------------

        # Creating a link. Payment buys indexing and resolution — the event
        # itself lives on relays and is free to publish.
        #
        # l402_dry_run is ON for local development: the full 402 handshake runs
        # without a Lightning backend or real sats. It MUST be turned off in
        # production or the paywall is decorative.
        # Slug reservation. Public — a reserved slug is worthless until a paid,
        # signed link claims it, and this is what lets the cheap tier prove a
        # slug is server-issued rather than user-chosen. NIP-98 auth is enforced
        # by sqzd, not the paywall.
        location = /api/links/slug {
            proxy_pass http://sqzd;
        }

        # Custom-slug availability check. Public — best-effort UX before payment.
        location = /api/links/available {
            proxy_pass http://sqzd;
        }

        # Cheap tier: a link on a server-issued (auto) slug.
        location = /api/links {
            l402                      on;
            # REAL payment. The Authorization-header collision is resolved: sqz
            # now reads NIP-98 from X-Nostr-Authorization, leaving Authorization
            # to the L402 credential. See docs/payments.md.
            l402_dry_run              off;
            l402_amount_msat_default  100000;  # 100 sats (value is millisats)
            l402_macaroon_timeout     0;       # no expiry on the credential
            # OFF with LNURL: auto-detect queries a Lightning node for
            # settlement, but a static address has none — so it hangs ~15s and
            # 502s while racing its own 402 challenge ("header already sent").
            # Completion here is the preimage flow (WebLN). NWC re-enables this.
            l402_auto_detect_payment  off;

            proxy_pass http://sqzd;
        }

        # Pricier tier: a link on a caller-chosen (custom) slug.
        location = /api/links/custom {
            l402                      on;
            l402_dry_run              off;
            l402_amount_msat_default  500000;  # 500 sats
            l402_macaroon_timeout     0;
            l402_auto_detect_payment  off;

            proxy_pass http://sqzd;
        }

        # Analytics dashboard. l402_indefinite_access means one 100-sat payment
        # grants ongoing access rather than charging per read.
        location = /api/analytics {
            l402                      on;
            l402_dry_run              off;
            l402_amount_msat_default  100000;  # 100 sats
            l402_macaroon_timeout     0;       # credential doesn't expire
            l402_indefinite_access    on;
            l402_auto_detect_payment  off;

            proxy_pass http://sqzd;
        }

        # Embedded assets carry no cache validators (zero modtime). 1h TTL;
        # filenames are unhashed, so avoid a longer cache.
        location /assets/ {
            proxy_pass http://sqzd;
            add_header Cache-Control "public, max-age=3600";
        }

        # ---- redirects -----------------------------------------------------
        # The hot path, and deliberately last so the specific routes above win.
        # Never paywalled: a short link that demands payment to follow is not a
        # short link.
        location / {
            proxy_pass http://sqzd;
        }
    }
}
