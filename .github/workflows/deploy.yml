# Deploys sqz on every push to main. Runs on a GitHub-hosted runner that SSHes
# into the VPS and runs the deploy there (build, recreate, reload, health check).
#
# Host prerequisites: /opt/sqz is a git checkout with a valid .env; the
# SQZ_SSH_* secrets authorize a key that can run Docker on the box.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sqz-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SQZ_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SQZ_SSH_HOST }}
          SSH_USER: ${{ secrets.SQZ_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd /opt/sqz
          git fetch --prune origin
          git reset --hard origin/main
          echo "deploying $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

          docker compose build sqzd
          docker compose up -d

          # nginx.conf is a single-file bind mount. `git reset` replaces it with
          # a new inode, but the running container still holds the old one, so an
          # in-place `nginx -s reload` reads stale config. Validate the NEW file
          # in a throwaway container, then force-recreate so the mount re-resolves.
          #
          # `</dev/null` is load-bearing: this whole script is piped to `bash -s`
          # over stdin, and `docker compose run` reads stdin — without this it
          # swallows the rest of the script (the force-recreate and health check),
          # so the deploy exits 0 having silently skipped both.
          if ! docker compose run --rm --no-deps -T nginx nginx -t </dev/null; then
            echo "::error::nginx config invalid — not recreating"
            exit 1
          fi
          docker compose up -d --force-recreate nginx

          # Health check on the host port from .env (defaults to 8000).
          PORT=$(grep -E '^SQZ_PORT=' .env | cut -d= -f2); PORT=${PORT:-8000}
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "http://localhost:${PORT}/health"; then
              echo "healthy on :${PORT}"; exit 0
            fi
            echo "waiting for sqzd health ($i/10)"; sleep 3
          done
          echo "::error::sqzd did not report healthy after deploy"
          docker compose logs --tail=50 sqzd nginx
          exit 1
          DEPLOY
